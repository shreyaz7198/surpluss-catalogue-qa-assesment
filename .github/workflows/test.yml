name: CI Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Unit, Integration & API Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Task 1 Planted Vulnerability Checks
        # Task 1 tests intentionally document existing codebase bugs
        continue-on-error: true
        run: npx vitest run tests/findings

      - name: Run Task 2 Unit & Integration Suites
        run: npx vitest run tests/unit tests/integration

      - name: Run Task 3 API & Access Control Suites
        run: npx vitest run tests/api

  e2e:
    name: Run Playwright E2E Journey
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Setup Database & Seed
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Build Next.js Application
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Production Server
        run: |
          npm run start &
          npx wait-on http://localhost:3001 --timeout 60000

      - name: Run Playwright E2E Suite
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: "http://localhost:3001"
        run: npx playwright test e2e/buyer-journey.spec.ts --project=chromium

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7